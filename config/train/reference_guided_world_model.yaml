# @package _global_
defaults:
  # Task-specific dataset, simulator, and restore settings live in config/train/data.
  - data: tworoom
  - _self_


planner_checkpoint: null
# Optional provenance override saved with rollout caches. The staged trainer
# always loads LeWM through planner_checkpoint for distillation and validation.
lewm_checkpoint: null
output_model_name: reference_guided_world_model
subdir: reference_guided_world_model/${now:%Y-%m-%d_%H-%M-%S}
seed: 42
device: cuda
img_size: 224
# Resolves legacy data profiles that use the LeWM clip-length interpolation.
wm:
  num_preds: 1
  history_size: 3
epochs: 10
train_split: 0.9
validation:
  # null validates all held-out clips after each epoch.
  max_batches: null
log_interval: 10
max_train_batches: null
grad_clip_norm: 1.0

# One deterministic global split: inexpensive LeWM distillation uses the first
# partition; simulator rollout/cached fine-tuning uses only the second.
staged_training:
  # Each phase is independently switchable. When cache generation is disabled,
  # rollout_cache.path is read as an existing completed cache.
  generate_rollout_cache: true
  distillation: true
  fine_tune: true
  # Required when distillation=false and fine_tune=true.
  distillation_checkpoint: null
  distillation_fraction: 0.9
  fine_tune_fraction: 0.1
  # Shared default schedule for all task launchers; each remains overrideable.
  distillation_epochs: 10
  fine_tune_epochs: 25
  distillation_lr: 1.0e-4
  fine_tune_lr: 3.0e-5
  # Split the simulator-cached fine-tuning partition again into train/validation.
  fine_tune_train_split: 0.9

loader:
  batch_size: 128
  num_workers: 6
  persistent_workers: true
  prefetch_factor: 3
  pin_memory: true

sampling:
  flow_steps: 16

optimizer:
  lr: 1.0e-4
  weight_decay: 1.0e-4

wandb:
  enabled: true
  project: leflow-dev
  entity: null
  mode: online

rollout_cache:
  # Controlled by staged_training.generate_rollout_cache. mode is retained only
  # for compatibility with older launch commands and does not select a stage.
  mode: generate
  path: null
  overwrite: false
  # Independent reproducible seed for frozen planner/IDM/simulator collection.
  # Saved in the finished HDF5 cache metadata.
  collection_seed: 42
  # If true, mode=generate exits after atomically writing the cache.
  generate_only: false
  chunk_size: 4096
  # null (or 0) preserves the original one-pass generator. A positive value
  # creates deterministic HDF5 shards of this many clips, closes the complete
  # simulator backend after every shard, then atomically merges the shards.
  # Completed shards are reused after an interruption when overwrite=false.
  partition_size: null
  # Optional cap used only for fast smoke tests. null collects every clip.
  max_records: null
