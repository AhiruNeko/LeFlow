# @package _global_
defaults:
  # Task-specific dataset, simulator, and restore settings live in config/train/data.
  - data: tworooms
  - _self_


planner_checkpoint: null
# Required only for rollout_cache.mode=use. It must match the LeWM used to
# create the cache; planner and IDM are not loaded in cache-only training.
lewm_checkpoint: null
output_model_name: reference_guided_world_model
subdir: reference_guided_world_model/${now:%Y-%m-%d_%H-%M-%S}
seed: 42
device: cuda
img_size: 224
# Resolves legacy data profiles that use the LeWM clip-length interpolation.
wm:
  num_preds: 1
  history_size: 3
epochs: 10
train_split: 0.9
validation:
  # null validates all held-out clips after each epoch.
  max_batches: null
log_interval: 10
max_train_batches: null
grad_clip_norm: 1.0

loader:
  batch_size: 128
  num_workers: 6
  persistent_workers: true
  prefetch_factor: 3
  pin_memory: true

sampling:
  flow_steps: 16

optimizer:
  lr: 1.0e-4
  weight_decay: 1.0e-4

wandb:
  enabled: true
  project: leflow-dev
  entity: null
  mode: online

rollout_cache:
  # online: original on-policy rollout every update.
  # generate: create the complete HDF5 cache once, then train from it.
  # use: train directly from an existing cache; only LeWM + this model load.
  mode: online
  path: null
  overwrite: false
  # Independent reproducible seed for frozen planner/IDM/simulator collection.
  # Saved in the finished HDF5 cache metadata.
  collection_seed: 42
  # If true, mode=generate exits after atomically writing the cache.
  generate_only: false
  chunk_size: 4096
  # Optional cap used only for fast smoke tests. null collects every clip.
  max_records: null
