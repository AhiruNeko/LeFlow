defaults:
  - _self_

planner_checkpoint: ???
output_model_name: reference_guided_world_model
subdir: reference_guided_world_model/${now:%Y-%m-%d_%H-%M-%S}
seed: 42
device: cuda
img_size: 224
epochs: 10
train_split: 0.9
log_interval: 10
max_train_batches: null
grad_clip_norm: 1.0

data:
  dataset:
    name: pusht_expert_train
    keys_to_load: [pixels, action, state]
    keys_to_cache: [action, state]

loader:
  batch_size: 4
  num_workers: 0

world:
  env_name: swm/PushT-v1
  num_envs: 4
  max_episode_steps: 50
  history_size: 1
  frame_skip: 1

sampling:
  flow_steps: 16

optimizer:
  lr: 1.0e-4
  weight_decay: 1.0e-4

wandb:
  enabled: true
  project: leflow-dev
  entity: null
  mode: online
