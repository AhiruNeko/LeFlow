defaults:
  - _self_

lewm_checkpoint: ???
output_model_name: latent_trajectory_cost
subdir: latent_trajectory_cost/${now:%Y-%m-%d_%H-%M-%S}

seed: 3072
device: cuda
img_size: 224
train_split: 0.9
epochs: 50
log_interval: 50
val_batches: 20
max_train_batches: null
grad_clip_norm: 1.0

# LeWM only encodes observations. Each latent transition represents
# trajectory.action_block raw environment steps, so one path spans
# trajectory.horizon * trajectory.action_block raw steps.
trajectory:
  horizon: 5
  # Number of raw environment actions represented by one latent transition.
  action_block: 5

trajectory_encoder:
  max_horizon: 20
  model_dim: 256
  representation_dim: 256
  depth: 4
  heads: 8
  mlp_dim: 1024
  dropout: 0.1

preference:
  # L = softplus(-(c_negative - c_positive) / beta)
  beta: 0.1

loss:
  sigreg:
    # Regularizes the joint expert/mismatch/noisy trajectory representation.
    weight: 1.0e-4
    kwargs:
      knots: 17
      num_proj: 1024

negatives:
  goal_mismatch_weight: 1.0
  noise_weight: 1.0
  # Multiplied by the batch latent standard deviation.  z_0 and z_H are fixed.
  noise_std: 0.10

episode_split:
  enabled: False
  train_fraction: 0.8
  seed: ${seed}
  split_file: null

wandb:
  enabled: True
  project: leflow-dev
  entity: null
  name: ${output_model_name}_h${trajectory.horizon}
  id: null
  resume: allow
  mode: online
  log_model: False
  # Cost histograms and q10/q50/q90 for expert, mismatch, and noisy paths.
  cost_distribution_interval: 200

loader:
  batch_size: 128
  num_workers: 6
  persistent_workers: True
  prefetch_factor: 3
  pin_memory: True

data:
  dataset:
    name: tworoom
    frameskip: ${trajectory.action_block}
    num_steps: ${eval:'${trajectory.horizon} + 1'}
    keys_to_load:
      - pixels
      - action
      - proprio
    keys_to_cache:
      - action
      - proprio

optimizer:
  lr: 1e-4
  weight_decay: 1e-4