defaults:
  - _self_

lewm_checkpoint: ???
output_model_name: latent_trajectory_cost
subdir: latent_trajectory_cost/${now:%Y-%m-%d_%H-%M-%S}

seed: 3072
device: cuda
img_size: 224
train_split: 0.9
epochs: 50
log_interval: 50
val_batches: 20
max_train_batches: null
grad_clip_norm: 1.0

# LeWM only encodes observations. Each latent transition represents`n# `trajectory.action_block` raw environment steps, so one path spans`n# `trajectory.horizon * trajectory.action_block` raw steps.
trajectory:
  horizon: 5
  # Number of raw environment actions represented by one latent transition.
  action_block: 5

trajectory_encoder:
  max_horizon: 20
  model_dim: 256
  representation_dim: 256
  depth: 4
  heads: 8
  mlp_dim: 1024
  dropout: 0.1

cost_model:
  # The lower-is-better score is calibrated to the closed interval [0, 1].
  output_activation: sigmoid

preference:
  # L = softplus(-(c_negative - c_positive) / beta). With a bounded margin,
  # 0.2 avoids saturation before paths are meaningfully ordered.
  beta: 0.2

loss:
  # Regularizes encoder representations only; it does not act on scalar costs.
  sigreg:
    weight: 0.005
    kwargs:
      knots: 17
      num_proj: 1024

negatives:
  goal_mismatch_weight: 1.0
  noise_weight: 1.0
  # Multiplied by the batch latent standard deviation.  z_0 and z_H are fixed.
  noise_std: 0.10

episode_split:
  enabled: False
  train_fraction: 0.8
  seed: ${seed}
  split_file: null

wandb:
  enabled: True
  project: leflow-dev
  entity: null
  name: ${output_model_name}_h${trajectory.horizon}
  id: null
  resume: allow
  mode: online
  log_model: False

loader:
  batch_size: 128
  num_workers: 6
  persistent_workers: True
  prefetch_factor: 3
  pin_memory: True

data:
  dataset:
    name: tworoom
    frameskip: ${trajectory.action_block}
    num_steps: ${eval:'${trajectory.horizon} + 1'}
    keys_to_load:
      - pixels
      - action
      - proprio
    keys_to_cache:
      - action
      - proprio

optimizer:
  lr: 1e-4
  weight_decay: 1e-4