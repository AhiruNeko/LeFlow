defaults:
  - _self_

# Frozen representation dynamics and the bundled original LeFlow inverse model.
lewm_checkpoint: ???
inverse_dynamics_checkpoint: ???

output_model_name: latent_planner
subdir: latent_planner_unified/${now:%Y-%m-%d_%H-%M-%S}

seed: 3072
device: cuda
img_size: 224
train_split: 0.9
log_interval: 50
grad_clip_norm: 1.0
lewm_history_size: 3

wandb:
  enabled: true
  project: leflow-dev
  entity: null
  name: ${output_model_name}_h${planner.horizon}
  id: null
  resume: allow
  mode: online
  log_model: false

loader:
  batch_size: 128
  num_workers: 6
  persistent_workers: true
  prefetch_factor: 3
  pin_memory: true

episode_split:
  enabled: false
  train_fraction: 0.8
  seed: ${seed}
  split_file: null

data:
  dataset:
    name: tworoom
    frameskip: ${planner.action_block}
    # A path contains z_0 ... z_H.
    num_steps: ${eval:'${planner.horizon} + 1'}
    keys_to_load:
      - pixels
      - action
      - proprio
    keys_to_cache:
      - action
      - proprio

planner:
  horizon: 5
  max_horizon: 20
  action_block: 5

flow:
  hidden_dim: 512
  depth: 4
  time_dim: 64
  dropout: 0.0
  # Must equal trajectory_encoder.representation_dim.
  path_feature_dim: 256
  heads: 8

experience:
  # One bundled LTC checkpoint containing both the trajectory encoder and cost model.
  checkpoint: ???

# Each synthetic update builds a same-task bank of noisy trajectories. One
# integer bank size is drawn uniformly per batch; this keeps every batch dense
# and avoids padding / cross-attention masks.
synthetic:
  noise_std: 0.10
  all_after_start_probability: 0.5
  memory_min_size: 0
  memory_max_size: 64

# Model-generated paths are collected without gradients. Each collection samples
# one (candidates, rounds) pair from these choices, so both one-shot and FIFO
# experience-generation histories enter the replay cache.
collection:
  task_batch_size: 16
  candidates_choices: [4, 8, 16]
  rounds_choices: [1, 2, 4]
  flow_steps: 16
  max_paths_per_task: 64

real_replay:
  # With task_batch_size=8, 16 banks retain up to 128 task records.
  cache_max_banks: 16
  # Each replay update draws one integer memory size uniformly from
  # [0, min(max_memory_size, available_paths)] for the whole batch.
  # Zero activates the no-memory branch only.
  max_memory_size: 64

# Each epoch traverses the complete synthetic loader once. It is split into
# cycles that each perform synthetic training, real collection, and real replay.
training:
  # Short step-based warm-up before the first complete epoch.
  bootstrap_synthetic_updates: 500
  epochs: 10
  cycles_per_epoch: 64
  real_updates_per_cycle: 25
  checkpoint_every_epochs: 1

ltc:
  # Sigmoid-bounded costs lie in [0, 1].
  beta: 0.2

loss:
  flow:
    empty_weight: 1.0
    memory_weight: 1.0
  # Requires same-task memory to reduce FM error relative to the no-memory
  # branch, while stop-gradient prevents degrading the baseline branch.
  use:
    weight: 0.5
    margin: 0.005
  sigreg:
    weight: 0.001
    kwargs:
      knots: 17
      num_proj: 1024

# Each parameter group receives only its intended loss gradient:
# flow <- planner loss; cost <- pairwise cost loss; encoder <- both.
optimizer:
  planner:
    lr: 1.0e-4
    weight_decay: 1.0e-4
  encoder:
    lr: 1.0e-6
    weight_decay: 1.0e-4
  cost:
    lr: 1.0e-6
    weight_decay: 1.0e-4