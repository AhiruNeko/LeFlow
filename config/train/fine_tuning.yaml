defaults:
  - _self_

# Phase-one, experience-conditioned planner checkpoint.
planner_checkpoint: ???

output_model_name: fine_tuned_latent_planner
subdir: latent_planner_finetune/closed_loop_h10

seed: 3072
device: cuda
img_size: 224
train_split: 0.9
epochs: 1
log_interval: 50
val_batches: 4
validation_interval_steps: 1000
max_train_batches: 2000
grad_clip_norm: 1.0
lewm_history_size: 3

wandb:
  enabled: true
  project: leflow-dev
  entity: null
  name: fine_tuned_latent_planner_h10
  id: null
  resume: allow
  mode: online
  log_model: false
  # Full FIFO-cost histograms are uploaded at this interval.
  real_experience_cost_distribution_interval: ${log_interval}

loader:
  batch_size: 32
  num_workers: 6
  persistent_workers: true
  prefetch_factor: 3
  pin_memory: true

episode_split:
  enabled: false
  train_fraction: 0.8
  seed: 3072
  split_file: null

data:
  dataset:
    name: pusht
    # One latent transition represents this many raw environment actions.
    frameskip: 5
    # H=10 requires 11 latent states: z_0 ... z_10.
    num_steps: 11
    keys_to_load:
      - pixels
      - action
      - proprio
    keys_to_cache:
      - action
      - proprio

planner:
  horizon: 10
  action_block: 5

# Every collection independently samples candidates in [1, 32], then runs
# ceil(max_size / candidates) FIFO rounds to fill the memory capacity.
collection:
  candidates_min: 1
  candidates_max: 32
  flow_steps: 16
  max_size: 64

experience:
  # Null loads LTC embedded in planner_checkpoint. Set only for an explicit
  # override with a separate combined LTC checkpoint.
  ltc_checkpoint: null

# These negatives are NOT placed in the Cross-Attention experience FIFO.
# They retain the original LTC preference calibration while the planner and
# shared Encoder are fine-tuned on dynamically generated experience paths.
ltc:
  beta: 0.1
  goal_mismatch_weight: 1.0
  noise_weight: 1.0
  noise_std: 0.10

# Sparse real-rollout calibration from the final collected FIFO bank.
dynamic_ltc:
  weight: 0.5
  sample_size: 8
  # Ignore nearly tied rollout outcomes when creating pairwise labels.
  label_margin: 0.001

loss:
  flow:
    weight: 1.0
  inverse:
    weight: 1.0
  consistency:
    weight: 0.1
  ltc:
    weight: 1.0
  experience:
    # Same cost-aware memory guidance used in phase-one planner training.
    weight: 0.02
    tau: 1.0
  # Off by default. Enable only as an explicit representation regularization
  # ablation after the closed-loop baseline is stable.
  sigreg:
    weight: 1.0e-4
    kwargs:
      knots: 17
      num_proj: 1024

# Encoder receives both planner and LTC gradients. Cost Model is updated only
# through LTC loss, because scalar costs are detached before FiLM conditioning.
optimizer:
  planner_lr: 1.0e-5
  encoder_lr: 1.0e-6
  cost_lr: 1.0e-6
  weight_decay: 1.0e-4
