_target_: latent_planner.LearnedLatentPathSolver
checkpoint: ${policy}
batch_size: 1
num_samples: 64
flow_steps: 16
# Temporarily rank candidates by one full autoregressive LeWM rollout
# and the predicted final-goal error, rather than per-segment feasibility.
score_mode: rollout_goal
segment_decay: 0.95  # unused when score_mode=rollout_goal
goal_weight: 1.0
consistency_weight: 0.0
smoothness_weight: 0.0
device: "cuda"
seed: ${seed}
history_size: 3
# The checkpoint selects original LeWM or Fast-LeWM. Set this only to relocate
# the frozen world-model weights when evaluating on another machine.
world_model_checkpoint: null
world_model_type: null
fast_source_dir: null
