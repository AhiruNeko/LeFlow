_target_: latent_planner.ExperienceGuidedLatentPathSolver
checkpoint: ${policy}
batch_size: 1
flow_steps: 16
rounds: 16
samples_per_round: 4
experience_max_size: 64
top_k: 64
# LTC costs are sigmoid-bounded but not globally calibrated across tasks.
# Disable early stopping by default; tune a threshold on validation if desired.
cost_threshold: null
# null loads LTC embedded in the unified planner checkpoint. Set this only to
# override it with a standalone bundled LTC checkpoint.
experience_checkpoint: null
device: "cuda"
seed: ${seed}
history_size: 3
