_target_: original_lewm_rank_solver.OriginalLeWMRankedJointSolver

# The joint checkpoint keeps its training-time generation world model.
checkpoint: ${policy}

# This checkpoint is used only for final candidate ranking.
original_lewm_checkpoint: pusht/lewm

batch_size: 1
num_samples: 64
flow_steps: 16
history_size: 3
device: cuda
seed: ${seed}
# Optional relocation overrides for the generator world model stored in the joint checkpoint.
world_model_checkpoint: null
world_model_type: null
fast_source_dir: null
